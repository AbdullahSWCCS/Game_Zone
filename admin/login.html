<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone Admin Login</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif; background: linear-gradient(135deg,#1f2937 0,#111827 100%); color:#f9fafb; }
        .login-card { width:min(420px,calc(100vw - 40px)); background:rgba(15,23,42,.96); border:1px solid rgba(148,163,184,.2); border-radius:18px; box-shadow:0 25px 60px rgba(15,23,42,.4); padding:32px; }
        .login-card h1 { font-size:1.8rem; margin-bottom:16px; color:#a78bfa; }
        .login-card p { margin-bottom:24px; color:#cbd5e1; }
        .login-card label { display:block; margin-bottom:8px; color:#e2e8f0; font-size:.95rem; }
        .login-card input { width:100%; padding:14px 16px; margin-bottom:18px; border-radius:12px; border:1px solid rgba(148,163,184,.2); background:#0f172a; color:#f8fafc; font-size:1rem; }
        .login-card button { width:100%; padding:14px 16px; border:none; border-radius:12px; background:linear-gradient(135deg,#8b5cf6,#38bdf8); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .2s ease,box-shadow .2s ease; }
        .login-card button:hover { transform:translateY(-1px); box-shadow:0 16px 30px rgba(56,189,248,.35); }
        .login-footer { margin-top:18px; font-size:.9rem; color:#94a3b8; text-align:center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Login</h1>
        <p>Enter the admin credentials to continue. This page is only for the admin account.</p>
        <form id="adminLoginForm">
            <label for="adminLoginEmail">Email</label>
            <input id="adminLoginEmail" type="email" placeholder="Admin email" required>
            <label for="adminLoginPassword">Password</label>
            <input id="adminLoginPassword" type="password" placeholder="Admin password" required>
            <button type="submit">Sign in</button>
        </form>
        <div class="login-footer">Your credentials are hidden from other users.</div>
    </div>

    <script src="../firebase-config.js"></script>
    <script src="../firebase-service.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const email = document.getElementById('adminLoginEmail').value.trim();
            const password = document.getElementById('adminLoginPassword').value;
            try {
                await window.GameZoneFirebase.signInAdmin(email, password);
                window.location.href = '/admin/admin.html';
            } catch (error) {
                alert(error.message || 'Admin login failed.');
            }
        });
    </script>
</body>
</html>
